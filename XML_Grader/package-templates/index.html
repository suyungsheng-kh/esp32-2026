<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XMLGrader｜積木程式 AI 自評系統</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f8fafc;color:#1e293b;line-height:1.7}header{background:#0f172a;color:#fff;padding:52px 24px}main{max-width:900px;margin:auto;padding:32px 20px}header>div{max-width:900px;margin:auto}h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:8px 0}h2{margin-top:0;font-size:1.25rem}.version{color:#fbbf24;font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 4px 12px #0f172a08}.button{display:inline-block;background:#d97706;color:#fff;text-decoration:none;padding:10px 20px;border-radius:9px;font-weight:700}.student{background:#0284c7}.note{margin-top:24px;color:#475569}a:focus-visible{outline:3px solid #fbbf24;outline-offset:4px}footer{margin-top:24px;font-size:.9rem;color:#64748b}
  </style>
</head>
<body>
  <header><div><div class="version">XMLGrader · 2026-10-04-unified</div><h1>積木程式 XML AI 自評系統</h1><p>教師設定作業與評分規則，學生上傳 XML 作品取得評語。</p></div></header>
  <main>
    <div class="cards">
      <section class="card"><h2>教師管理</h2><p>登入後管理多份作業、上傳參考解答、單檔試評及查詢成績。</p><a class="button" href="teacher.html">進入教師管理</a></section>
      <section class="card"><h2>學生自評</h2><p>選擇老師開放的作業，輸入學號，並上傳積木程式匯出的 XML。</p><a class="button student" href="student.html">開始學生自評</a></section>
    </div>
    <section class="card note"><h2>首次使用</h2><p>管理者請先閱讀資料夾內的 <a href="README.md">README</a>，完成後端設定與試評，再將網址提供給學生。</p><p>教師管理與學生自評共用一個後端網址；支援 Colab 或 Cloud Run。</p></section>
    <footer>本套件可獨立部署，不需要 ESP32 課程網站的其他檔案。</footer>
  </main>
</body>
</html>
