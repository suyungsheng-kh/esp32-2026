<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 x motoBlockly - 每日三分鐘回饋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Noto Sans TC"','sans-serif']},colors:{maker:{light:'#fff7ed',DEFAULT:'#f97316',dark:'#c2410c'}}}}}</script>
  <style>.field{width:100%;border:1px solid #cbd5e1;border-radius:.75rem;padding:.8rem .9rem;outline:none}.field:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15)}textarea.field{min-height:5.5rem;resize:vertical}</style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4 sm:px-6"><a href="https://suyungsheng-kh.github.io/esp32-2026/" class="flex items-center gap-2 font-bold"><i class="fa-solid fa-microchip text-maker text-xl"></i><span class="hidden sm:inline">Lung-Hwa <span class="text-maker">物聯網創客</span></span></a><a id="back-day" href="https://suyungsheng-kh.github.io/esp32-2026/" class="rounded-lg bg-maker-light px-3 py-2 text-sm font-bold text-maker-dark hover:bg-orange-100">回到課程</a></div></nav>
  <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
    <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-xl sm:p-10"><p class="text-sm font-bold tracking-[.2em] text-maker">EXIT TICKET</p><h1 id="page-title" class="mt-3 text-3xl font-black">每日三分鐘回饋</h1><p class="mt-2 text-slate-500">下課前，用具體描述留下今天的學習與除錯歷程。</p>
      <form class="mt-8 space-y-6"><label class="block font-bold">今天最成功的是什麼？<textarea class="field mt-2" data-field="success" placeholder="例如：我讓紅綠燈照順序亮起來。"></textarea></label><label class="block font-bold">我卡在哪裡？<textarea class="field mt-2" data-field="stuck" placeholder="例如：按鈕接好後，LED 還是不會亮。"></textarea></label><label class="block font-bold">我怎麼解決？<textarea class="field mt-2" data-field="solution" placeholder="例如：先核對腳位，再看課程圖，最後請同學幫我複查。"></textarea></label><label class="block font-bold">今天我幫助誰／被誰幫助？<textarea class="field mt-2" data-field="help" placeholder="例如：我幫小組同學檢查 G/V/S；同學提醒我使用上拉電阻。"></textarea></label></form>
      <div class="mt-8 flex flex-col items-center justify-between gap-3 border-t border-slate-200 pt-6 sm:flex-row"><p class="text-xs text-slate-400">內容僅暫存在這台裝置；若老師要收集，請複製後交到指定表單。</p><div class="flex gap-3"><button id="clear" type="button" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-bold text-slate-500 hover:bg-slate-50">清除</button><button id="copy" type="button" class="rounded-lg bg-maker px-4 py-2 text-sm font-bold text-white hover:bg-maker-dark"><i class="fa-solid fa-copy mr-1"></i>複製回饋</button></div></div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search), day=['1','2','3'].includes(params.get('day'))?params.get('day'):'', key=`esp32-daily-reflection-${day||'general'}`, fields=[...document.querySelectorAll('[data-field]')];
    const labels={1:'Day 1｜每日三分鐘回饋',2:'Day 2｜每日三分鐘回饋',3:'Day 3｜每日三分鐘回饋'}; if(day){document.title=`ESP32 x motoBlockly - ${labels[day]}`;document.getElementById('page-title').textContent=labels[day];document.getElementById('back-day').href=`https://suyungsheng-kh.github.io/esp32-2026/day-${day}.html`;document.getElementById('back-day').textContent=`回到 Day ${day}`;}
    let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){} fields.forEach(x=>{x.value=data[x.dataset.field]||'';x.addEventListener('input',()=>{const next={};fields.forEach(y=>next[y.dataset.field]=y.value);localStorage.setItem(key,JSON.stringify(next));});});
    document.getElementById('clear').onclick=()=>{if(confirm('確定清除這次回饋？')){fields.forEach(x=>x.value='');localStorage.removeItem(key);}};
    document.getElementById('copy').onclick=async()=>{const text=`${labels[day]||'每日回饋'}\n最成功：${fields[0].value}\n卡關：${fields[1].value}\n解決方式：${fields[2].value}\n幫助／被幫助：${fields[3].value}`;try{await navigator.clipboard.writeText(text);document.getElementById('copy').innerHTML='<i class="fa-solid fa-check mr-1"></i>已複製';setTimeout(()=>document.getElementById('copy').innerHTML='<i class="fa-solid fa-copy mr-1"></i>複製回饋',1500)}catch(e){alert('無法自動複製，請手動選取內容。')}};
  </script>
</body>
</html>
