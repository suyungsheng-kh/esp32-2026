<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 x motoBlockly - 上電前檢核卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Noto Sans TC"','sans-serif']},colors:{maker:{light:'#fff7ed',DEFAULT:'#f97316',dark:'#c2410c'}}}}}</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur">
    <div class="mx-auto flex h-16 max-w-4xl items-center justify-between px-4 sm:px-6">
      <a href="https://suyungsheng-kh.github.io/esp32-2026/" class="flex items-center gap-2 font-bold"><i class="fa-solid fa-microchip text-maker text-xl"></i><span class="hidden sm:inline">Lung-Hwa <span class="text-maker">物聯網創客</span></span></a>
      <a href="https://suyungsheng-kh.github.io/esp32-2026/circuit.html" class="rounded-lg bg-maker-light px-3 py-2 text-sm font-bold text-maker-dark hover:bg-orange-100"><i class="fa-solid fa-plug-circle-check mr-1"></i>接線練習</a>
    </div>
  </nav>

  <header class="bg-gradient-to-br from-slate-800 to-slate-900 px-4 py-12 text-center text-white sm:py-16">
    <p class="text-sm font-bold tracking-[.22em] text-maker-light">POWER-ON CHECK</p>
    <h1 class="mt-3 text-3xl font-black sm:text-4xl">上電前檢核卡</h1>
    <p class="mx-auto mt-3 max-w-2xl text-slate-300">一人接線、一人複查；三項都確認後才接上 USB 電源。</p>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
    <section class="rounded-2xl border border-red-200 bg-red-50 p-5 sm:p-7">
      <h2 class="text-xl font-black text-red-800"><i class="fa-solid fa-triangle-exclamation mr-2"></i>安全鐵則</h2>
      <p class="mt-2 text-sm leading-6 text-red-700">接線、拔線或修改電路時都先斷電；冒煙、異味或異常發熱時，立刻拔掉 USB 並通知老師。</p>
    </section>

    <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between"><div><h2 class="text-xl font-black">互相複查 3 項</h2><p class="mt-1 text-sm text-slate-500">複查者請實際看著線路確認，不是只問「有沒有」。</p></div><span id="check-count" class="font-black text-maker">0 / 3</span></div>
      <div class="mt-5 space-y-3">
        <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 p-4 transition hover:border-maker/60"><input class="power-check mt-1 h-5 w-5 accent-maker" type="checkbox"><span><b>① G／V／S 對應正確</b><small class="mt-1 block text-slate-500">GND 接 G、VCC 接 V、訊號腳接 S；沒有把 V 和 G 接反。</small></span></label>
        <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 p-4 transition hover:border-maker/60"><input class="power-check mt-1 h-5 w-5 accent-maker" type="checkbox"><span><b>② 腳位與模組一致</b><small class="mt-1 block text-slate-500">依課程接線圖核對每條訊號線的 GPIO／I2C 腳位，沒有鬆脫或插錯排。</small></span></label>
        <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 p-4 transition hover:border-maker/60"><input class="power-check mt-1 h-5 w-5 accent-maker" type="checkbox"><span><b>③ 線路沒有短路風險</b><small class="mt-1 block text-slate-500">裸線沒有互碰；模組放置穩定；需要調整時知道先拔掉 USB。</small></span></label>
      </div>
      <div id="power-result" class="mt-6 rounded-xl bg-slate-100 p-4 text-center text-sm font-bold text-slate-500">完成三項互相複查後，才可以上電測試。</div>
    </section>

    <div class="mt-6 grid gap-4 sm:grid-cols-2">
      <a href="https://suyungsheng-kh.github.io/esp32-2026/circuit.html" class="rounded-xl bg-maker px-5 py-4 text-center font-bold text-white shadow-sm transition hover:bg-maker-dark"><i class="fa-solid fa-plug-circle-check mr-1"></i>前往接線練習</a>
      <a href="https://suyungsheng-kh.github.io/esp32-2026/debug-passport.html" class="rounded-xl bg-sky-600 px-5 py-4 text-center font-bold text-white shadow-sm transition hover:bg-sky-700"><i class="fa-solid fa-compass mr-1"></i>卡關時開除錯護照</a>
    </div>
  </main>
  <script>
    const checks=[...document.querySelectorAll('.power-check')], count=document.getElementById('check-count'), result=document.getElementById('power-result');
    function update(){const done=checks.filter(x=>x.checked).length;count.textContent=`${done} / 3`;if(done===3){result.textContent='✅ 複查完成：可以接上 USB，並先觀察是否有異常。';result.className='mt-6 rounded-xl border border-green-200 bg-green-50 p-4 text-center text-sm font-bold text-green-700';}else{result.textContent='完成三項互相複查後，才可以上電測試。';result.className='mt-6 rounded-xl bg-slate-100 p-4 text-center text-sm font-bold text-slate-500';}}
    checks.forEach(x=>x.addEventListener('change',update));
  </script>
</body>
</html>
